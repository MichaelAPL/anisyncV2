[project]
name = "anisync"
version = "0.1.0"
description = "Sync your MyAnimeList, AniList and Kitsu anime lists"
authors = [
    { name = "Miguel Pat", email = "michaelapl96@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.3.0",
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "procrastinate>=3.11.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
anisync = "anisync.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# S = flake8-bandit: S608 fails CI on SQL built from strings (use bound parameters), S105/S106 on hard-coded secrets.
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"e2e/*" = ["S105", "S106"]  # fake credentials of a throwaway test server
"tests/**" = ["S101", "S105", "S106", "S311"]  # asserts, fake credentials and fake random in tests
