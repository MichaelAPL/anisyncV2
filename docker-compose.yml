services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: anisync
      POSTGRES_PASSWORD: anisync
      POSTGRES_DB: anisync
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anisync"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
